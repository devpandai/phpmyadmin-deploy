apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: ghcr.io/devpandai/phpmyadmin:latest
        ports:
        - containerPort: 80
        env:
        # Hapus konfigurasi otomatis DB agar phpMyAdmin minta input manual
        - name: PMA_ARBITRARY
          value: "1"   # <- ini penting!
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
  selector:
    app: phpmyadmin
